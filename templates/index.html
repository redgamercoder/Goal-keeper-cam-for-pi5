{% extends "base.html" %}
{% block title_suffix %} — Dashboard{% endblock %}

{% block content %}
<section class="dashboard">
  <h1>System Status</h1>
  <div class="status-grid">
    <div class="card" id="card-state">
      <span class="label">State</span>
      <span class="value" id="val-state">—</span>
    </div>
    <div class="card" id="card-fps">
      <span class="label">FPS</span>
      <span class="value" id="val-fps">—</span>
    </div>
    <div class="card">
      <span class="label">Clips recorded</span>
      <span class="value" id="val-clips">—</span>
    </div>
    <div class="card">
      <span class="label">Disk free</span>
      <span class="value" id="val-disk">—</span>
    </div>
    <div class="card">
      <span class="label">Last ball seen</span>
      <span class="value" id="val-ball">—</span>
    </div>
    <div class="card">
      <span class="label">Uptime</span>
      <span class="value" id="val-uptime">—</span>
    </div>
  </div>

  <h2>Runtime Config</h2>
  <form id="config-form" class="config-form">
    <label>Hold seconds (after ball lost)
      <input type="number" name="hold_seconds" min="1" max="60" step="1" placeholder="5">
    </label>
    <label>Confidence threshold
      <input type="number" name="confidence" min="0.1" max="1.0" step="0.05" placeholder="0.45">
    </label>
    <label>Detect every N frames
      <input type="number" name="detect_every_n" min="1" max="5" step="1" placeholder="1">
    </label>
    <button type="submit">Apply</button>
    <span id="config-feedback"></span>
  </form>
</section>
{% endblock %}

{% block scripts %}
<script>
  // Auto-refresh status every 2 seconds
  async function refresh() {
    try {
      const r = await fetch('/api/status');
      const d = await r.json();
      document.getElementById('val-state').textContent = d.state;
      document.getElementById('val-fps').textContent = d.fps + ' fps';
      document.getElementById('val-clips').textContent = d.clip_count;
      document.getElementById('val-disk').textContent = d.disk_free_gb + ' GB';
      document.getElementById('val-ball').textContent =
        d.last_ball_time ? new Date(d.last_ball_time * 1000).toLocaleTimeString() : 'never';
      document.getElementById('val-uptime').textContent = formatUptime(d.uptime_s);

      const card = document.getElementById('card-state');
      card.className = 'card state-' + (d.state || 'idle').toLowerCase();
    } catch(e) {}
  }

  function formatUptime(s) {
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return [h, m, sec].map(n => String(n).padStart(2,'0')).join(':');
  }

  refresh();
  setInterval(refresh, 2000);

  document.getElementById('config-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const body = {};
    for (const [k, v] of fd.entries()) { if (v !== '') body[k] = parseFloat(v); }
    const r = await fetch('/api/config', { method:'POST', body: JSON.stringify(body) });
    const fb = document.getElementById('config-feedback');
    fb.textContent = r.ok ? 'Saved.' : 'Error.';
    setTimeout(() => fb.textContent = '', 2000);
  });
</script>
{% endblock %}
